# Murray's FSM - Backup System Configuration
# ============================================
# This file defines what to backup and how

# Backup identification
BACKUP_PREFIX="murray-fsm"
BACKUP_VERSION="1.0.0"

# Directories to backup (space-separated, relative to project root or absolute)
BACKUP_DIRS=(
  "apps"
  "supabase"
  "docs"
)

# Files to backup (individual files)
BACKUP_FILES=(
  "package.json"
  "pnpm-workspace.yaml"
  "README.md"
  ".gitignore"
)

# Patterns to exclude from backup
EXCLUDE_PATTERNS=(
  "node_modules"
  ".next"
  ".expo"
  "dist"
  "build"
  ".git"
  "*.log"
  ".env"
  ".env.local"
  "__pycache__"
  "*.pyc"
  ".DS_Store"
  "Thumbs.db"
)

# Environment exports to capture
CAPTURE_ENVIRONMENT=(
  "node_version"      # node --version
  "npm_version"       # npm --version
  "pnpm_version"      # pnpm --version
  "python_version"    # python3 --version
  "pip_packages"      # pip freeze
  "system_packages"   # dpkg or brew
)

# Database backup configuration (if applicable)
DATABASE_BACKUP_ENABLED=false
DATABASE_URL=""
DATABASE_TYPE="postgres"  # postgres, mysql, sqlite

# Storage configuration
STORAGE_TYPE="local"  # local, s3, gcs, azure
LOCAL_BACKUP_DIR="${HOME}/backups/murray-fsm"

# S3 Configuration (if STORAGE_TYPE=s3)
S3_BUCKET=""
S3_PREFIX="backups/murray-fsm"
S3_REGION="us-east-1"

# GCS Configuration (if STORAGE_TYPE=gcs)
GCS_BUCKET=""
GCS_PREFIX="backups/murray-fsm"

# Retention policy
RETENTION_DAILY=7      # Keep daily backups for N days
RETENTION_WEEKLY=4     # Keep weekly backups for N weeks
RETENTION_MONTHLY=3    # Keep monthly backups for N months

# Security
ENCRYPTION_ENABLED=false
ENCRYPTION_KEY_FILE="${HOME}/.murray-fsm/backup.key"
# Generate key: openssl rand -base64 32 > ~/.murray-fsm/backup.key

# Integrity
CHECKSUM_ALGORITHM="sha256"  # md5, sha1, sha256, sha512

# Compression
COMPRESSION="gzip"  # gzip, bzip2, xz, zstd, none
COMPRESSION_LEVEL=6  # 1-9

# Notifications (optional)
NOTIFY_ON_SUCCESS=false
NOTIFY_ON_FAILURE=true
NOTIFY_WEBHOOK_URL=""

# Logging
LOG_LEVEL="INFO"  # DEBUG, INFO, WARN, ERROR
LOG_FILE="${HOME}/backups/murray-fsm/backup.log"

# FSM Configuration
FSM_STATE_FILE="${HOME}/.murray-fsm/fsm_state.json"
FSM_ENABLE_RETRY=true
FSM_MAX_RETRIES=3
FSM_RETRY_DELAY=30  # seconds

# Parallel operations
PARALLEL_ENABLED=true
PARALLEL_JOBS=4
